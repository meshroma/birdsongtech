<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦅 Bird Song Frequency Visualizer - Torre Flavia</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1e1e24;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 100%;
            max-width: 500px;
            border: 1px solid #2e2e38;
        }
        h1 {
            font-size: 1.5rem;
            color: #4ade80;
            margin-bottom: 5px;
        }
        .specie-tag {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
            margin-top: 20px;
            border-radius: 8px;
        }
        .visualizer-box {
            background: #09090b;
            height: 120px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 0 20px;
            overflow: hidden;
            border: 1px solid #1e1e24;
        }
        .bar {
            width: 8px;
            height: 15px;
            background-color: #4ade80;
            border-radius: 4px;
            transition: height 0.1s ease;
        }
        .status-msg {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Visualizzatore Audio Bioacustica</h1>
    <div id="specieNome" class="specie-tag">Rilevamento...</div>

    <!-- Alloggiamento Grafico Reattivo -->
    <div class="visualizer-box" id="visualizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <audio id="audioPlayer" controls></audio>
    <div id="status" class="status-msg">Caricamento traccia...</div>
</div>

<script>
    // Funzione per estrarre i parametri GET dall'URL
    function getUrlParams() {
        const params = {};
        window.location.search.substring(1).split("&").forEach(pair => {
            const [key, value] = pair.split("=");
            if (key) params[key] = decodeURIComponent(value);
        });
        return params;
    }

    window.addEventListener('DOMContentLoaded', () => {
        const params = getUrlParams();
        const player = document.getElementById('audioPlayer');
        const specieTxt = document.getElementById('specieNome');
        const statusTxt = document.getElementById('status');
        const bars = document.querySelectorAll('.bar');

        // Assegnazione parametri estratti
        if (params.audio) {
            player.src = params.audio;
            specieTxt.innerText = params.specie ? "Specie: " + params.specie : "Specie: Non Specificata";
            statusTxt.innerText = "Traccia caricata correttamente: " + params.audio.split('/').pop();
        } else {
            specieTxt.innerText = "Nessun dato";
            statusTxt.innerText = "Inserisci i parametri nell'URL (?audio=file.wav&specie=Nome)";
        }

        // Simulazione animazione barre di frequenza basata sullo stato di riproduzione
        let animationInterval;
        player.onplay = () => {
            animationInterval = setInterval(() => {
                bars.forEach(bar => {
                    const randomHeight = Math.floor(Math.random() * 80) + 15;
                    bar.style.height = randomHeight + "px";
                    bar.style.backgroundColor = "#38bdf8";
                });
            }, 100);
        };

        player.onpause = player.onended = () => {
            clearInterval(animationInterval);
            bars.forEach(bar => {
                bar.style.height = "15px";
                bar.style.backgroundColor = "#4ade80";
            });
        };
    });
</script>

</body>
</html>
